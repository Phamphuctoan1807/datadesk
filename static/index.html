<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>DataDesk · Sắp xếp, tô màu và xuất dữ liệu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#15202e;--mute:#5d6b7d;--line:#d9e0e9;--acc:#2457f5;--navy:#0f1b2d;--ok:#12803f;--bad:#b3261e;--soft:#eaf0ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.55 "Be Vietnam Pro",system-ui,"Segoe UI",Roboto,sans-serif;min-height:100vh;transition:background 0.3s ease,color 0.3s ease}
.top{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px;position:relative;z-index:10;flex-wrap:wrap}
.logo{width:30px;height:30px;border-radius:7px;background:var(--acc);display:grid;place-items:center;font-weight:700}
.top b{font-size:17px}.top span{color:#9fb0c6;font-size:13px}
main{max-width:1120px;margin:0 auto;padding:22px 16px 80px;position:relative;z-index:2}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px;transition:all 0.25s ease}
.card h2{font-size:16px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 14px;font-size:13px}
#drop{display:block;border:2px dashed var(--line);border-radius:10px;padding:30px 14px;text-align:center;cursor:pointer;color:var(--mute);transition:all 0.25s ease}
#drop:hover,#drop.on,#drop:focus-within{border-color:var(--acc);background:var(--soft)}
#drop b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}#drop input{position:absolute;opacity:0;width:1px;height:1px}
#msg{margin:10px 0 0;color:var(--bad);font-weight:500;min-height:1.2em}#msg.ok{color:var(--ok);font-weight:500}
.rw{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.rw>b{min-width:92px;font-weight:500;color:var(--mute);font-size:13px}
select,input:not([type=checkbox]):not([type=color]){font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}
input[type=color]{width:38px;height:34px;border:1px solid var(--line);border-radius:6px;padding:2px;background:#fff}
input:disabled{background:var(--bg)}
button{font:inherit;cursor:pointer}
.add{border:1px dashed var(--acc);color:var(--acc);background:#fff;border-radius:6px;padding:6px 12px;font-weight:500;transition:all 0.2s ease}
.add:hover{background:var(--soft)}
.rm{border:0;background:none;color:var(--mute);font-size:18px;padding:2px 8px}.rm:hover{color:var(--bad)}
.go{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:12px 24px;font-weight:700;font-size:15px;text-decoration:none;display:inline-block;transition:all 0.2s ease}
.go:hover{box-shadow:0 4px 14px rgba(36,87,245,0.4)}
.go:disabled{opacity:.6}
.tw{overflow:auto;max-height:380px;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
th{background:#eef2f7;position:sticky;top:0}.fl td{color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 12px}.stats div{color:var(--mute)}.stats b{color:var(--ink);font-size:18px;margin-right:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:12px}.chips label{display:flex;gap:6px;align-items:center}
.chk{list-style:none;padding:0;margin:0 0 14px}.chk li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.chk .ic{font-weight:700;width:18px;flex:none}.y .ic{color:var(--ok)}.n .ic{color:var(--bad)}.chk small{display:block;color:var(--mute)}
.verdict{font-weight:700;font-size:16px;margin:0 0 8px}
.hint{color:var(--mute);font-size:13px;margin:6px 0 0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.rt{margin-left:auto;display:flex;gap:12px;align-items:center}.badge{background:#1d2c44;color:#9fb0c6!important;border-radius:999px;padding:3px 11px;font-size:12px!important}
.lo{background:none;border:1px solid #3a4b66;color:#dbe4f0;border-radius:6px;padding:5px 12px}.lo:hover{background:#1d2c44}
.sg{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}.sg small{display:block;color:var(--mute)}
.gr td{cursor:pointer}.gr td:hover{outline:1px solid var(--acc);outline-offset:-1px}.gr td.mkd{background:#FF5C5C;color:#15202e}.gr td.rn{color:var(--mute);background:#eef2f7;cursor:default;outline:0}
.add:disabled{opacity:.45;cursor:not-allowed}
.bar{position:sticky;bottom:0;z-index:15;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 -4px 14px rgba(15,27,45,.12)}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:4px 11px;font-size:13px}.chip:hover{border-color:var(--acc);background:var(--soft)}
code{background:#eef2f7;border-radius:4px;padding:1px 5px;font-size:13px}
.sg{flex-wrap:wrap}
@media (max-width:640px){.top{padding:10px 14px}.top>span{display:none}.rt{gap:8px}.badge{font-size:11px!important;padding:2px 8px}.sg>.rw{width:100%}main{padding:16px 10px 70px}.card{padding:14px}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}label.f input:not([type=checkbox]),label.f textarea{width:100%}

/* === CANVAS & MODE SWITCHER STYLES === */
#bg-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:0.85;transition:opacity 0.4s ease}
body.file-loaded:not(.tech-mode) #bg-canvas{opacity:0.12}
.mode-switch-wrap{display:inline-flex;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);border-radius:999px;padding:3px;gap:4px;align-items:center}
.mode-btn{background:none;border:0;color:#9fb0c6;font-size:12.5px;font-weight:600;padding:5px 14px;border-radius:999px;cursor:pointer;transition:all 0.2s ease;font-family:inherit}
.mode-btn:hover{color:#fff}
.mode-btn.active{background:#2457f5;color:#fff;box-shadow:0 0 10px rgba(36,87,245,0.5)}

/* === GIAI ĐOẠN 3: SPEECH BUBBLE LOADER === */
.speech-bubble-overlay{position:relative;margin:12px 0 6px;display:flex;justify-content:center;z-index:20;animation:bubblePopIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275)}
.speech-bubble-card{background:rgba(15,27,45,0.95);border:1px solid #00f0ff;box-shadow:0 10px 30px rgba(0,0,0,0.5),0 0 22px rgba(0,240,255,0.35);border-radius:14px;padding:14px 20px;display:flex;align-items:center;gap:16px;color:#fff;max-width:460px;width:100%;backdrop-filter:blur(12px)}
.radar-box{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.radar-ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent}
.radar-ring.r1{border-top-color:#00f0ff;border-right-color:#00f0ff;animation:spin 1s linear infinite}
.radar-ring.r2{inset:4px;border-bottom-color:#a855f7;border-left-color:#a855f7;animation:spinRev 1.4s linear infinite}
.radar-sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(0,240,255,0.35) 0deg,transparent 90deg);animation:spin 1.2s linear infinite}
.radar-core{font-size:16px;z-index:2;color:#00f0ff;text-shadow:0 0 8px #00f0ff}
.bubble-info{flex:1;min-width:0}
.bubble-info b{display:block;font-size:14px;color:#00f0ff;margin-bottom:2px}
.bubble-info span{display:block;font-size:12px;color:#9fb0c6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble-bar-wrap{height:4px;background:rgba(255,255,255,0.1);border-radius:99px;margin-top:8px;overflow:hidden}
.bubble-bar{height:100%;width:0%;background:linear-gradient(90deg,#00f0ff,#2457f5,#a855f7);border-radius:99px;transition:width 0.3s ease;box-shadow:0 0 8px #00f0ff}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
@keyframes bubblePopIn{from{opacity:0;transform:scale(0.85) translateY(-8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.bubble-exit{animation:bubblePopOut 0.35s ease forwards!important}
@keyframes bubblePopOut{to{opacity:0;transform:scale(0.75) translateY(-14px)}}

/* === GIAI ĐOẠN 4: HIGH-TECH WORKSPACE (#tech-space) === */
#tech-space{position:relative;width:100%;min-height:760px;background:radial-gradient(circle at center,#0d1b2a 0%,#050a12 100%);border:1px solid rgba(0,240,255,0.3);border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,0.7),inset 0 0 60px rgba(0,240,255,0.06);margin-bottom:20px;user-select:none}
.tech-grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(0,240,255,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,0.06) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;z-index:0}
.tech-toolbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:rgba(7,14,23,0.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,240,255,0.25);flex-wrap:wrap}
.tech-tool-left,.tech-tool-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tech-btn{background:rgba(15,27,45,0.85);border:1px solid rgba(0,240,255,0.35);color:#00f0ff;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:all 0.2s ease;font-family:inherit}
.tech-btn:hover{background:rgba(0,240,255,0.15);border-color:#00f0ff;box-shadow:0 0 10px rgba(0,240,255,0.4);color:#fff}
.tech-btn.active{background:#00f0ff;color:#070e17;box-shadow:0 0 14px rgba(0,240,255,0.6)}
.tech-tool-pill{background:rgba(168,85,247,0.15);border:1px solid #a855f7;color:#d8b4fe;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:grab;display:inline-flex;align-items:center;gap:6px;box-shadow:0 0 10px rgba(168,85,247,0.25);transition:transform 0.15s ease}
.tech-tool-pill:active{cursor:grabbing;transform:scale(1.05)}

#tech-viewport{position:relative;width:100%;height:700px;overflow:hidden;cursor:grab}
#tech-viewport.panning{cursor:grabbing}
#tech-canvas-layer{position:absolute;width:2400px;height:1800px;left:0;top:0;transform-origin:center center}

/* SVG Cables */
#tech-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.cable-wire{fill:none;stroke-width:2.5px;filter:drop-shadow(0 0 5px rgba(0,240,255,0.7));stroke-dasharray:7 12;animation:cablePulse 1.2s linear infinite}
@keyframes cablePulse{to{stroke-dashoffset:-38}}
.cross-wire{fill:none;stroke-width:2.5px;stroke:#ffaa00;filter:drop-shadow(0 0 6px #ffaa00);stroke-dasharray:6 10;animation:crossPulse 1s linear infinite}
@keyframes crossPulse{to{stroke-dashoffset:-32}}

/* Central Node */
#central-node{position:absolute;z-index:8;transform:translate(-50%,-50%);background:rgba(10,22,36,0.92);border:2px solid #00f0ff;box-shadow:0 0 25px rgba(0,240,255,0.5),inset 0 0 18px rgba(0,240,255,0.2);border-radius:16px;padding:16px 20px;text-align:center;color:#fff;cursor:pointer;backdrop-filter:blur(14px);min-width:220px;transition:box-shadow 0.25s ease,transform 0.25s ease}
#central-node:hover{box-shadow:0 0 35px rgba(0,240,255,0.8),inset 0 0 25px rgba(0,240,255,0.3);transform:translate(-50%,-50%) scale(1.03)}
.central-pulse-ring{position:absolute;inset:-10px;border-radius:24px;border:1px solid rgba(0,240,255,0.4);animation:ringPulse 2.4s ease-out infinite;pointer-events:none}
@keyframes ringPulse{0%{transform:scale(0.95);opacity:0.8}100%{transform:scale(1.2);opacity:0}}
.central-icon{font-size:28px;margin-bottom:4px;filter:drop-shadow(0 0 8px #00f0ff)}
.central-title{font-size:15px;font-weight:700;color:#00f0ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;margin:0 auto}
.central-stats{font-size:11.5px;color:#94a3b8;margin-top:6px;line-height:1.4}
.central-hint{font-size:10.5px;color:#38bdf8;margin-top:4px}

/* Column Nodes */
.tech-col-node{position:absolute;z-index:6;background:rgba(12,24,39,0.9);border:1px solid rgba(0,240,255,0.35);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.5),0 0 12px rgba(0,240,255,0.15);backdrop-filter:blur(10px);color:#e2e8f0;width:200px;height:52px;transition:width 0.28s cubic-bezier(0.4,0,0.2,1),height 0.28s cubic-bezier(0.4,0,0.2,1),box-shadow 0.2s ease;display:flex;flex-direction:column;overflow:hidden}
.tech-col-node.expanded{width:290px;height:380px;z-index:10;box-shadow:0 12px 36px rgba(0,0,0,0.7),0 0 20px rgba(0,240,255,0.35);border-color:#00f0ff}
.tech-col-node.eye-docked{border-color:#a855f7;box-shadow:0 0 22px rgba(168,85,247,0.6)}
.col-node-header{padding:8px 12px;background:rgba(15,30,50,0.9);display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:grab;border-bottom:1px solid rgba(0,240,255,0.15);user-select:none;flex:none}
.col-node-header:active{cursor:grabbing}
.col-header-left{display:flex;align-items:center;gap:6px;min-width:0}
.col-drag-handle{color:rgba(0,240,255,0.5);font-size:14px;cursor:grab}
.col-title{font-size:13px;font-weight:700;color:#38bdf8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.col-type-tag{font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(36,87,245,0.3);color:#93c5fd;border:1px solid rgba(36,87,245,0.5);flex:none}
.col-expand-btn{background:none;border:0;color:#94a3b8;cursor:pointer;font-size:13px;padding:2px 4px;border-radius:4px}
.col-expand-btn:hover{color:#00f0ff;background:rgba(0,240,255,0.15)}

/* Column Stream Body */
.col-stream-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 8px;display:none;background:rgba(6,14,24,0.6)}
.tech-col-node.expanded .col-stream-body{display:block}
.col-stream-body::-webkit-scrollbar{width:4px}
.col-stream-body::-webkit-scrollbar-thumb{background:#00f0ff;border-radius:4px;box-shadow:0 0 4px #00f0ff}
.col-stream-body::-webkit-scrollbar-track{background:rgba(0,10,20,0.5)}

.stream-row{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:6px;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.05);transition:all 0.25s cubic-bezier(0.4,0,0.2,1);overflow:hidden;max-height:40px;opacity:1}
.stream-row:hover{background:rgba(0,240,255,0.1)}
.stream-row.collapsed-row{max-height:0;opacity:0;padding-top:0;padding-bottom:0;margin-top:0;margin-bottom:0;border:0;pointer-events:none}
.stream-row.match-highlight{background:rgba(255,170,0,0.25)!important;box-shadow:0 0 8px rgba(255,170,0,0.4);border-color:rgba(255,170,0,0.6)}
.stream-row.active-dock-match{background:rgba(0,240,255,0.2)!important;box-shadow:0 0 8px rgba(0,240,255,0.4);border-color:#00f0ff}
.sr-stt{color:#94a3b8;font-family:monospace;font-size:11px;min-width:32px;flex:none}
.sr-name{color:#38bdf8;font-size:11px;max-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.sr-val{color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.sr-val.empty{color:#f87171;font-style:italic}

/* Cyber Eye Dock Bar */
.eye-dock-panel{padding:6px 8px;background:rgba(26,14,46,0.9);border-bottom:1px solid #a855f7;display:flex;align-items:center;gap:6px;display:none}
.tech-col-node.eye-docked .eye-dock-panel{display:flex}
.eye-dock-panel input{flex:1;background:rgba(0,0,0,0.5);border:1px solid #a855f7;border-radius:6px;color:#fff;font-size:11.5px;padding:4px 8px;outline:none;font-family:inherit}
.eye-dock-panel input:focus{box-shadow:0 0 8px rgba(168,85,247,0.6)}
.eye-dock-close{background:none;border:0;color:#c084fc;font-size:13px;cursor:pointer;padding:2px 5px}
.eye-dock-close:hover{color:#fff}

/* Global Magnifier */
#global-search-container{position:sticky;top:48px;z-index:14;padding:8px 16px;background:rgba(10,20,34,0.95);border-bottom:1px solid rgba(255,170,0,0.3);display:flex;align-items:center;gap:10px;backdrop-filter:blur(10px);display:none;animation:slideDown 0.25s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
#global-search-input{flex:1;background:rgba(0,0,0,0.6);border:1px solid #ffaa00;border-radius:8px;padding:7px 12px;color:#fff;font-size:13px;outline:none;box-shadow:0 0 8px rgba(255,170,0,0.25)}
#global-search-input:focus{box-shadow:0 0 14px rgba(255,170,0,0.5)}
.btn-trace{background:linear-gradient(90deg,#ffaa00,#f59e0b);color:#070e17;font-weight:700;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;box-shadow:0 0 12px rgba(255,170,0,0.4);font-family:inherit}
.btn-trace:hover{box-shadow:0 0 18px rgba(255,170,0,0.7);transform:scale(1.02)}

/* Hologram Dossier Modal */
.tech-modal-overlay{position:fixed;inset:0;background:rgba(3,7,18,0.78);backdrop-filter:blur(8px);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px}
.tech-modal-card{background:rgba(10,20,35,0.96);border:1px solid #00f0ff;box-shadow:0 20px 60px rgba(0,0,0,0.8),0 0 30px rgba(0,240,255,0.3);border-radius:16px;max-width:640px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;color:#fff}
.tech-modal-header{padding:14px 18px;border-bottom:1px solid rgba(0,240,255,0.2);display:flex;align-items:center;justify-content:space-between;background:rgba(0,240,255,0.06)}
.holo-tag{font-size:11px;font-weight:700;letter-spacing:1px;color:#38bdf8}
.tech-modal-header h3{margin:2px 0 0;font-size:17px;color:#00f0ff}
.tech-modal-close{background:none;border:0;color:#94a3b8;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px}
.tech-modal-close:hover{color:#fff;background:rgba(255,255,255,0.1)}
.tech-modal-body{padding:16px 18px;overflow-y:auto;flex:1}
.dossier-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:600px){.dossier-grid{grid-template-columns:1fr}}
.dossier-item{background:rgba(255,255,255,0.04);border:1px solid rgba(0,240,255,0.15);border-radius:8px;padding:8px 12px}
.dossier-item b{display:block;font-size:11.5px;color:#38bdf8;margin-bottom:2px}
.dossier-item span{font-size:13px;color:#f8fafc;word-break:break-word}
.tech-modal-footer{padding:12px 18px;border-top:1px solid rgba(0,240,255,0.2);display:flex;gap:10px;justify-content:flex-end;background:rgba(0,0,0,0.2);flex-wrap:wrap}

/* === TOÀN BỘ CÁC TÁC VỤ KHI Ở TECH-MODE === */
body.tech-mode{background:#050a12;color:#dbeafe}
body.tech-mode .top{background:#08101d;border-bottom:1px solid rgba(0,240,255,0.2);box-shadow:0 4px 20px rgba(0,0,0,0.5)}
body.tech-mode .mode-btn.active{background:#00f0ff;color:#070e17;box-shadow:0 0 12px rgba(0,240,255,0.7)}
body.tech-mode .card{background:rgba(13,27,42,0.88);border-color:rgba(0,240,255,0.25);color:#dbeafe;box-shadow:0 8px 30px rgba(0,0,0,0.6);backdrop-filter:blur(14px)}
body.tech-mode .card h2{color:#00f0ff;text-shadow:0 0 8px rgba(0,240,255,0.4)}
body.tech-mode .card h3{color:#38bdf8}
body.tech-mode .sub{color:#94a3b8}
body.tech-mode .hint{color:#94a3b8}
body.tech-mode #drop{border-color:rgba(0,240,255,0.35);background:rgba(0,240,255,0.03);color:#94a3b8}
body.tech-mode #drop:hover,body.tech-mode #drop.on{border-color:#00f0ff;background:rgba(0,240,255,0.08);box-shadow:0 0 20px rgba(0,240,255,0.25)}
body.tech-mode #drop b{color:#00f0ff}
body.tech-mode .rw>b{color:#38bdf8}
body.tech-mode select,body.tech-mode input:not([type=checkbox]):not([type=color]),body.tech-mode textarea{background:rgba(6,14,24,0.85);color:#fff;border-color:rgba(0,240,255,0.3)}

<script>
const $=q=>document.querySelector(q),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const OPS=[['contains','chứa'],['eq','bằng'],['gt','lớn hơn'],['lt','nhỏ hơn'],['empty','để trống'],['notempty','không trống'],['dup','bị trùng']];
const PAL=['#FFE08A','#FFB4B4','#B8F0CF','#B9D5FF','#E0CCFF'],TN={text:'Văn bản',number:'Số',date:'Ngày'};
let ST=null;
let currentMode=localStorage.getItem('ST_MODE')||'serious';

/* === CANVAS PARTICLE ENGINE === */
const bgCanvas=$('#bg-canvas'),bgCtx=bgCanvas.getContext('2d');
let bgW,bgH;
function resizeBg(){bgW=bgCanvas.width=window.innerWidth;bgH=bgCanvas.height=window.innerHeight}
window.addEventListener('resize',resizeBg);resizeBg();

const BG_TOKENS=['0101','42.5%','NULL','ID:904','∑','.xlsx','JSON','C++','128.0','VARCHAR','SELECT *','JOIN','TRUE','DATA','#FF0055','0x7F','NaN','1010','SCHEMA','KEY_ID','COUNT()','2026-10','AES256','UTF-8'];
const BG_COLORS=['#2457f5','#00f0ff','#a855f7','#10b981','#f59e0b','#38bdf8'];
let mousePos={x:-9999,y:-9999};
window.addEventListener('mousemove',e=>{mousePos.x=e.clientX;mousePos.y=e.clientY});
window.addEventListener('mouseleave',()=>{mousePos.x=-9999;mousePos.y=-9999});

const bgParticles=[];
for(let i=0;i<48;i++){
  bgParticles.push({
    text:BG_TOKENS[Math.floor(Math.random()*BG_TOKENS.length)],
    x:Math.random()*bgW,y:Math.random()*bgH,
    vx:(Math.random()-0.5)*0.8,vy:(Math.random()-0.5)*0.8,
    baseVx:(Math.random()-0.5)*0.7,baseVy:(Math.random()-0.5)*0.7,
    size:Math.floor(Math.random()*4+11),
    color:BG_COLORS[Math.floor(Math.random()*BG_COLORS.length)],
    alpha:Math.random()*0.45+0.25,
    dAlpha:(Math.random()-0.5)*0.008
  });
}

function loopBgCanvas(){
  bgCtx.clearRect(0,0,bgW,bgH);
  const R=120;
  for(let p of bgParticles){
    const dx=p.x-mousePos.x,dy=p.y-mousePos.y,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<R&&dist>0){
      const force=(R-dist)/R*2.4;
      p.vx+=(dx/dist)*force;
      p.vy+=(dy/dist)*force;
    }
    p.vx=p.vx*0.95+p.baseVx*0.05;
    p.vy=p.vy*0.95+p.baseVy*0.05;
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<-70)p.x=bgW+70;if(p.x>bgW+70)p.x=-70;
    if(p.y<-30)p.y=bgH+30;if(p.y>bgH+30)p.y=-30;
    p.alpha+=p.dAlpha;
    if(p.alpha>0.7||p.alpha<0.2)p.dAlpha*=-1;
    bgCtx.font=`600 ${p.size}px monospace`;
    bgCtx.fillStyle=p.color;
    bgCtx.globalAlpha=p.alpha;
    bgCtx.fillText(p.text,p.x,p.y);
  }
  bgCtx.globalAlpha=1;
  requestAnimationFrame(loopBgCanvas);
}
loopBgCanvas();

/* === MODE SWITCHER (ĐỒNG BỘ CẢ 2 MODE ĐẦY ĐỦ TÁC VỤ) === */
function setMode(mode){
  currentMode=mode;
  localStorage.setItem('ST_MODE',mode);
  if(mode==='tech'){
    document.body.classList.add('tech-mode');
    $('#btn-mode-serious').classList.remove('active');
    $('#btn-mode-tech').classList.add('active');
    // Mode công nghệ: Hiện mạng dây Node Graph ở trên, VÀ hiện đầy đủ các tác vụ ở dưới
    $('#tech-space').style.display=ST?'block':'none';
    $('#work').style.display='block';
    if(ST){renderTechWorkspace();ui()}
  }else{
    document.body.classList.remove('tech-mode');
    $('#btn-mode-serious').classList.add('active');
    $('#btn-mode-tech').classList.remove('active');
    // Mode nghiêm túc: Ẩn mạng dây, hiện đầy đủ các tác vụ theo phong cách văn phòng
    $('#tech-space').style.display='none';
    $('#work').style.display='block';
    if(ST)ui();
  }
}
$('#btn-mode-serious').onclick=()=>setMode('serious');
$('#btn-mode-tech').onclick=()=>setMode('tech');

/* === SPEECH BUBBLE LOADER === */
let loaderTimer=null;
function showBubbleLoader(fn){
  const lb=$('#loader-bubble');if(!lb)return;
  lb.classList.remove('bubble-exit');lb.style.display='flex';
  $('#bubble-title').textContent='Đang phân tích: '+(fn||'Tệp dữ liệu');
  const steps=['Đang kết nối & tải dữ liệu...','Đang phân tích cấu trúc bảng & kiểu dữ liệu...','Đang rà soát ô trống & dòng trùng lặp...','Đang lập chỉ mục dữ liệu & hoàn tất...'];
  let sIdx=0;$('#bubble-step').textContent=steps[0];$('#bubble-bar').style.width='22%';
  clearInterval(loaderTimer);
  loaderTimer=setInterval(()=>{
    sIdx++;
    if(sIdx<steps.length){
      $('#bubble-step').textContent=steps[sIdx];
      $('#bubble-bar').style.width=((sIdx+1)*25)+'%';
    }
  },300);
}
function hideBubbleLoader(){
  clearInterval(loaderTimer);
  const bb=$('#bubble-bar');if(bb)bb.style.width='100%';
  setTimeout(()=>{
    const lb=$('#loader-bubble');
    if(lb){
      lb.classList.add('bubble-exit');
      setTimeout(()=>{lb.style.display='none';lb.classList.remove('bubble-exit')},350);
    }
  },200);
}

async function api(u,o){o=o||{};o.headers=Object.assign({'X-Requested-With':'datadesk'},o.headers||{});const r=await fetch(u,o);if(r.status===401){location='/login';throw new Error('Phiên đăng nhập đã hết hạn.')}let d={};try{d=await r.json()}catch(e){}if(!r.ok||d.error)throw new Error(d.error||'Lỗi máy chủ ('+r.status+')');return d}
function msg(t,ok){const m=$('#msg');m.textContent=t||'';m.className=ok?'ok':''}


function parseClientFile(f){
  const reader = new FileReader();
  reader.onload = function(evt){
    try {
      const text = evt.target.result;
      let headers = [], rows = [];
      if (f.name.endsWith('.json')){
        const data = JSON.parse(text);
        if(Array.isArray(data) && data.length > 0){
          headers = Object.keys(data[0]);
          rows = data.map(item => headers.map(k => item[k] !== undefined && item[k] !== null ? String(item[k]) : ''));
        }
      } else {
        const delimiter = f.name.endsWith('.tsv') ? '\t' : (text.includes('\t') ? '\t' : ',');
        const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
        if(lines.length > 0){
          headers = lines[0].split(delimiter).map(h => h.trim().replace(/^["']|["']$/g, ''));
          for(let i=1; i<lines.length; i++){
            const parts = lines[i].split(delimiter).map(p => p.trim().replace(/^["']|["']$/g, ''));
            if(parts.length > 0) rows.push(parts);
          }
        }
      }
      if(!headers.length){
        throw new Error('Không tìm thấy dữ liệu dạng bảng trong file này.');
      }
      let totalEmpty = 0;
      const cols = headers.map((h, cIdx) => {
        let empty = 0, numCount = 0, dateCount = 0;
        const vals = [];
        for(let r=0; r<rows.length; r++){
          const val = rows[r][cIdx] !== undefined ? rows[r][cIdx] : '';
          if(!val.trim()) empty++;
          else {
            vals.push(val);
            if(!isNaN(Number(val.replace(/[,\s₫đ$]/g, '')))) numCount++;
            if(/\d{1,4}[/\-.]\d{1,2}[/\-.]\d{1,4}/.test(val)) dateCount++;
          }
        }
        totalEmpty += empty;
        const colType = (dateCount / Math.max(1, vals.length) > 0.7) ? 'date' : (numCount / Math.max(1, vals.length) > 0.7 ? 'number' : 'text');
        return {
          name: h || ('Cột ' + (cIdx+1)),
          type: colType,
          empty: empty,
          unique: new Set(vals).size,
          sample: vals[0] || ''
        };
      });
      
      const tableData = {
        name: f.name,
        n_rows: rows.length,
        n_cols: cols.length,
        dropped: 0,
        dup: 0,
        empty: totalEmpty,
        colored: 0,
        header: true,
        columns: cols,
        hints: [],
        preview: rows.slice(0, 8),
        rows: [headers, ...rows]
      };
      
      document.body.classList.add('file-loaded');
      ST = {
        id: 'client_' + Date.now(),
        name: f.name,
        tables: [tableData],
        t: 0,
        fc: {op_id:null,target:'',expr:'',res:null,ai:'',note:''},
        ops: {list:[], can_undo:false, can_redo:false, numfmt:'auto', warnings:[]},
        rep: null,
        sorts: [{col:-1,dir:'asc',type:'auto'}],
        hls: [],
        flts: [],
        mode: 'all',
        onlyHl: false,
        fmt: 'xlsx',
        formulaMode: 'value',
        res: null,
        mgTa: 0,
        mgTb: 0,
        mgRes: null,
        mgMode: 'UNION',
        keyA: '',
        keyB: '',
        clientMode: true,
        clientRows: rows,
        grid: {start: 0, total: rows.length, rows: rows.slice(0, 100)}
      };
      setInfo(tableData);
      hideBubbleLoader();
      const dropLabel = $('#drop b');
      if(dropLabel) dropLabel.innerHTML = `✓ Đã tải: <span style="color:var(--acc)">${esc(f.name)}</span> (${rows.length} dòng, ${cols.length} cột) <small style="color:#10b981">[Chế độ trực tiếp]</small>`;
      setTimeout(()=>{
        const target=currentMode==='tech'?$('#tech-space'):$('#work');
        if(target)target.scrollIntoView({behavior:'smooth',block:'start'});
      }, 400);
    } catch(err){
      hideBubbleLoader();
      msg(err.message || 'Lỗi khi đọc file.');
    }
  };
  if(f.name.endsWith('.xlsx') || f.name.endsWith('.xlsm') || f.name.endsWith('.docx') || f.name.endsWith('.pdf')){
    hideBubbleLoader();
    msg('Tệp ' + f.name.split('.').pop().toUpperCase() + ' cần máy chủ Python/C++ để giải mã. Hãy chạy "python server.py" hoặc thử tải file CSV/TSV/JSON trực tiếp trên trình duyệt.');
  } else {
    reader.readAsText(f);
  }
}

async function upload(f){
  if(!f)return;
  msg('');showBubbleLoader(f.name);const fd=new FormData();fd.append('file',f);
  try{
    const d=await api('/api/analyze',{method:'POST',body:fd});
    document.body.classList.add('file-loaded');
    ST={
      id:d.id,
      name:d.name,
      tables:d.tables,
      t:0,
      fc:{op_id:null,target:'',expr:'',res:null,ai:'',note:''},
      ops:null,
      rep:null,
      sorts:[{col:-1,dir:'asc',type:'auto'}],
      hls:[],
      flts:[],
      mode:'all',
      onlyHl:false,
      fmt:'xlsx',
      formulaMode:'value',
      res:null,
      mgTa:0,
      mgTb:d.tables.length>1?1:0,
      mgRes:null,
      mgMode:'UNION',
      keyA:'',
      keyB:''
    };
    setInfo(d.tables[0]);
    hideBubbleLoader();
    suggest();
    const dropLabel=$('#drop b');
    if(dropLabel)dropLabel.innerHTML=`✓ Đã tải: <span style="color:var(--acc)">${esc(d.name)}</span> (${d.tables[0].n_rows} dòng, ${d.tables[0].n_cols} cột)`;
    setTimeout(()=>{
      const target=currentMode==='tech'?$('#tech-space'):$('#work');
      if(target)target.scrollIntoView({behavior:'smooth',block:'start'});
    },400);
  }catch(e){
    // If server api fails (e.g. GitHub Pages or server offline), gracefully parse client-side
    console.warn('API error, falling back to client-side parser:', e);
    parseClientFile(f);
  }
}

function setInfo(i,keep){
  ST.info=i;ST.hdr=i.header;ST.res=null;
  if(!keep||!ST.cols||ST.cols.length!==i.columns.length)ST.cols=i.columns.map((_,c)=>c);
  if(!keep){ST.sorts=[{col:-1,dir:'asc',type:'auto'}];ST.hls=[];ST.flts=[];ST.sug=null;ST.marks=new Set();ST.me=false;ST.grid=null}
  ui();
  loadGrid(i.header?1:0);
  loadOps();
  if(currentMode==='tech'){
    $('#tech-space').style.display='block';
    renderTechWorkspace();
  }
}

async function loadGrid(start){
  if(ST && ST.clientMode && ST.clientRows){
    const s = Math.max(0, start);
    ST.grid = {
      start: s,
      total: ST.clientRows.length,
      rows: ST.clientRows.slice(s, s + 100)
    };
    ui();
    if(currentMode==='tech')updateAllColumnStreamData();
    return;
  }
  try{
    ST.grid=await api(`/api/rows?id=${ST.id}&t=${ST.t}&start=${start}&n=100`);
    ui();
    if(currentMode==='tech')updateAllColumnStreamData();
  }catch(e){msg(e.message)}
}
function pageGrid(d){loadGrid(Math.max(ST.hdr?1:0,ST.grid.start+d*100))}
async function loadTable(t,h,keep){try{const i=await api(`/api/table?id=${ST.id}&t=${t}&header=${h?1:0}`);ST.t=t;setInfo(i,keep)}catch(e){msg(e.message)}}

const D=(k,i,f)=>`data-k="${k}" data-i="${i}" data-f="${f}"`;
const colSel=(k,i,v)=>`<select ${D(k,i,'col')}><option value="-1">Chọn cột…</option>${ST.info.columns.map((c,n)=>`<option value="${n}"${n==v?' selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
const opSel=(k,r,i)=>`<select ${D(k,i,'op')}>${OPS.map(o=>`<option value="${o[0]}"${r.op===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select>`;
const valIn=(k,r,i)=>`<input ${D(k,i,'value')} value="${esc(r.value||'')}" placeholder="Giá trị" ${['empty','notempty','dup'].includes(r.op)?'disabled':''}>`;
const rm=(k,i)=>`<button class="rm" data-rm="${k}" data-i="${i}" aria-label="Xóa dòng này">×</button>`;

function ui(){
  if(!ST||!ST.info)return;
  const I=ST.info,C=I.columns;let h='';
  h+=`<section class="card" id="card-review"><h2>Kết quả rà soát: ${esc(ST.name)}</h2><p class="sub">Kiểm tra lại các cột và kiểu dữ liệu nhận diện trước khi chọn cách xử lý.</p>
  <div class="rw">${ST.tables.length>1?`<select id="tsel">${ST.tables.map((x,i)=>`<option value="${i}"${i===ST.t?' selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}
  <label class="chips" style="margin:0"><span><input type="checkbox" id="hdr"${ST.hdr?' checked':''}${ST.ops&&ST.ops.list.length?' disabled':''}> Dòng đầu tiên là tiêu đề cột</span></label></div>
  <div class="stats"><div><b>${I.n_rows}</b>dòng dữ liệu</div><div><b>${I.n_cols}</b>cột</div><div><b>${I.empty}</b>ô trống</div><div><b>${I.dup}</b>dòng trùng hoàn toàn</div></div>
  ${I.dropped?`<p class="hint">${I.dropped} dòng trống hoàn toàn trong file gốc sẽ không đưa vào kết quả.</p>`:''}
  ${I.colored?`<p class="hint">File gốc có ${I.colored} ô đã tô màu. Các màu này được giữ nguyên khi xuất Excel.</p>`:''}
  <div class="tw"><table><tr><th>Cột</th><th>Kiểu nhận diện</th><th>Ô trống</th><th>Giá trị khác nhau</th><th>Ví dụ</th></tr>${C.map(c=>`<tr><td>${esc(c.name)}</td><td>${TN[c.type]}</td><td>${c.empty}</td><td>${c.unique}</td><td>${esc(c.sample)}</td></tr>`).join('')}</table></div></section>`;
  h+=mergeCard();
  h+=pipeCard();
  h+=nzCard();
  h+=fcCard();
  h+=rlCard();
  h+=sug();

function res(){const r=ST.res;if(!r)return'';
  if(r.error)return`<p class="verdict" id="res" style="color:var(--bad)">${esc(r.error)}</p>`;
  let h=`<div id="res" style="margin-top:14px"><p class="verdict" style="color:var(--${r.ok?'ok':'bad'})">${r.ok?'Dữ liệu đã được kiểm tra, toàn bộ chính xác.':'Có điểm chưa khớp ở bước kiểm tra (xem dấu ✗ bên dưới). Bạn vẫn có thể tải file, nhưng nên kiểm tra kỹ trước khi dùng.'}</p><p class="hint" style="margin:0 0 6px">Dữ liệu được xử lý bằng bộ xử lý ${esc(r.engine)} và đối chiếu lại bằng bản Python độc lập. Trạng thái quy trình: <b>${({SAFE:'An toàn',REVIEW_REQUIRED:'Cần kiểm tra',UNSAFE:'Không an toàn'})[r.status]||''}</b>.</p>
  <ul class="chk">${r.checks.map(c=>`<li class="${c.ok?'y':'n'}"><span class="ic">${c.ok?'✓':'✗'}</span><span>${esc(c.t)}<small>${esc(c.d)}</small></span></li>`).join('')}</ul>`;
  h+=`<p class="sub">Xem trước ${Math.min(r.preview.length-(r.header?1:0),100)} trên ${r.total} dòng:</p><div class="tw"><table>${r.preview.map((row,i)=>{const th=r.header&&i===0;return'<tr class="fl">'+row.map((v,c)=>{const f=r.fills[i][c];return`<${th?'th':'td'}${f?` style="background:${f}"`:''}>${esc(v)}</${th?'th':'td'}>`}).join('')+'</tr>'}).join('')}</table></div>`;
  if(!r.total)h+='<p class="hint">Không có dòng nào khớp điều kiện nên file chỉ có dòng tiêu đề.</p>';
  if(r.token)h+=`<div style="display:flex;gap:10px;align-items:center;margin:14px 0 0;flex-wrap:wrap"><a class="go" href="/api/download/${r.token}" download="${esc(r.filename)}">${r.ok?'Tải ':'Vẫn tải '}${esc(r.filename)}</a><a class="add" style="text-decoration:none;padding:8px 14px;border-radius:6px;display:inline-block" href="/api/validate/audit/${r.token}?format=csv" download="audit_log.csv">📥 Tải Audit Log (CSV)</a><a class="add" style="text-decoration:none;padding:8px 14px;border-radius:6px;display:inline-block" href="/api/validate/audit/${r.token}?format=json" download="audit_log.json">📄 Audit Log (JSON)</a></div>`;else if(r.downloadUrl)h+=`<p style="margin:14px 0 0"><a class="go" href="${r.downloadUrl}" download="${esc(r.filename)}">Tải ${esc(r.filename)}</a></p>`;
  return h+'</div>'}

async function run(auto){
  document.querySelectorAll('#go,#go2,#btn-tech-export').forEach(b=>{b.disabled=true;b.textContent='Đang xử lý và kiểm tra…'});
  if(ST && ST.clientMode && ST.clientRows){
    let processed = [...ST.clientRows];
    const okFlts = ST.flts.filter(x=>x.col>=0);
    if(okFlts.length > 0){
      processed = processed.filter(row => {
        const matchItem = f => {
          const val = String(row[f.col] || '').toLowerCase();
          const target = String(f.value || '').toLowerCase();
          if(f.op === 'contains') return val.includes(target);
          if(f.op === 'eq') return val === target;
          if(f.op === 'empty') return val === '';
          if(f.op === 'notempty') return val !== '';
          if(f.op === 'gt') return Number(val) > Number(target);
          if(f.op === 'lt') return Number(val) < Number(target);
          return true;
        };
        return ST.mode === 'all' ? okFlts.every(matchItem) : okFlts.some(matchItem);
      });
    }
    const okSorts = ST.sorts.filter(x=>x.col>=0);
    if(okSorts.length > 0){
      processed.sort((a,b)=>{
        for(let s of okSorts){
          const va = a[s.col] || '', vb = b[s.col] || '';
          const numA = Number(va), numB = Number(vb);
          let cmp = 0;
          if(!isNaN(numA) && !isNaN(numB)) cmp = numA - numB;
          else cmp = String(va).localeCompare(String(vb), 'vi');
          if(cmp !== 0) return s.dir === 'desc' ? -cmp : cmp;
        }
        return 0;
      });
    }
    const cols = ST.cols.length > 0 ? ST.cols : ST.info.columns.map((_,i)=>i);
    const outHeaders = cols.map(c => ST.info.columns[c].name);
    const outRows = processed.map(r => cols.map(c => r[c] !== undefined ? r[c] : ''));
    let fileContent = '';
    let mimeType = 'text/csv;charset=utf-8;';
    let fileExt = ST.fmt || 'csv';
    if(fileExt === 'json'){
      const jsonData = outRows.map(r => {
        let obj = {};
        outHeaders.forEach((h, idx) => obj[h || ('Cột ' + (idx + 1))] = r[idx]);
        return obj;
      });
      fileContent = JSON.stringify(jsonData, null, 2);
      mimeType = 'application/json;charset=utf-8;';
    } else if(fileExt === 'tsv'){
      fileContent = '\ufeff' + [outHeaders, ...outRows].map(r => r.map(v => String(v).replace(/\t/g, ' ')).join('\t')).join('\r\n');
      mimeType = 'text/tab-separated-values;charset=utf-8;';
    } else {
      fileExt = 'csv';
      fileContent = '\ufeff' + [outHeaders, ...outRows].map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
      mimeType = 'text/csv;charset=utf-8;';
    }
    const blob = new Blob([fileContent], {type: mimeType});
    const url = URL.createObjectURL(blob);
    const fn = (ST.name.replace(/\.[^.]+$/, '') || 'datadesk') + '_da_xu_ly.' + fileExt;
    
    ST.res = {
      ok: true,
      engine: 'Trình duyệt (Client Engine)',
      status: 'SAFE',
      filename: fn,
      total: processed.length,
      header: true,
      checks: [
        {ok: true, t: 'Kiểm tra cấu trúc và số cột', d: 'Tất cả cột xuất ra đúng theo yêu cầu'},
        {ok: true, t: 'Bảo toàn số dòng hợp lệ', d: `Đã lọc và giữ lại ${processed.length} dòng`},
        {ok: true, t: 'Khớp kiểu dữ liệu', d: 'Dữ liệu xuất ra nguyên vẹn, hỗ trợ tiếng Việt có dấu UTF-8'}
      ],
      preview: [outHeaders, ...outRows.slice(0, 10)],
      fills: Array(outRows.length + 1).fill(Array(cols.length).fill(null)),
      token: null,
      downloadUrl: url
    };
    ui();
    const a = document.createElement('a');
    a.href = url;
    a.download = fn;
    document.body.appendChild(a);
    a.click();
    a.remove();
    const bte=$('#btn-tech-export');if(bte){bte.disabled=false;bte.textContent='📥 Xuất file'}
    alert(`✓ Đã xử lý thành công ${processed.length} dòng và tự động tải file "${fn}"!`);
    return;
  }
  const ok=L=>L.filter(x=>x.col>=0);
  try{ST.res=await api('/api/process',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:ST.id,table:ST.t,header:ST.hdr,sorts:ok(ST.sorts),highlights:ok(ST.hls),filters:ok(ST.flts),filter_mode:ST.mode,only_highlighted:ST.onlyHl,marks:[...ST.marks].map(k=>k.split(':').map(Number)),mark_empty:ST.me,columns:ST.cols,format:ST.fmt,formula_mode:ST.formulaMode||'value'})})}
  catch(e){ST.res={error:e.message}}
  ui();
  if(auto&&ST.res.ok&&ST.res.token){const a=document.createElement('a');a.href='/api/download/'+ST.res.token;a.download=ST.res.filename;document.body.appendChild(a);a.click();a.remove()}
  const r=$('#res');if(r)r.scrollIntoView({behavior:'smooth',block:'center'});
  const bte=$('#btn-tech-export');if(bte){bte.disabled=false;bte.textContent='📥 Xuất file'}
  if(ST.res.token){
    alert(ST.res.ok?'Đã xử lý và kiểm tra thành công! File sẵn sàng để tải về.':'Có điểm chưa khớp khi kiểm tra đối chiếu. Bạn có thể xem kết quả chi tiết bên dưới.');
    window.location.href='/api/download/'+ST.res.token;
  }
}

function mkCard(){
  const I=ST.info,G=ST.grid,C=I.columns;let g='<p class="hint">Đang tải dữ liệu…</p>';
  if(G){const h=ST.hdr?1:0;
    g=`<div class="tw" style="max-height:340px"><table class="gr"><tr><th>#</th>${C.map(c=>`<th>${esc(c.name)}</th>`).join('')}</tr>${G.rows.map((r,k)=>{const i=G.start+k;return`<tr><td class="rn">${i+1}</td>${r.map((v,c)=>`<td data-r="${i}" data-c="${c}"${ST.marks.has(i+':'+c)?' class="mkd"':''}>${esc(v)}</td>`).join('')}</tr>`}).join('')}</table></div>
    <div class="rw" style="margin-top:8px"><button class="add" data-pg="-1"${G.start<=h?' disabled':''}>Trang trước</button><button class="add" data-pg="1"${G.start+G.rows.length>=G.total?' disabled':''}>Trang sau</button><span class="hint" style="margin:0">Dòng ${G.start+1} đến ${G.start+G.rows.length} trên ${G.total}</span></div>`}
  return`<section class="card" id="card-mark"><h2>Đánh dấu dữ liệu thiếu (tô đỏ)</h2><p class="sub">Bấm vào ô trong bảng để tô đỏ, bấm lần nữa để bỏ. Ô đỏ giữ nguyên màu trong file Excel xuất ra để đi báo cáo, kể cả sau khi sắp xếp hay lọc.</p>
  <div class="rw"><label><input type="checkbox" id="me"${ST.me?' checked':''}> Tự động tô đỏ tất cả ô trống (${I.empty} ô)</label></div>${g}
  <div class="rw" style="margin-top:8px"><span id="mc">Đã đánh dấu thủ công: <b>${ST.marks.size}</b> ô</span><button class="add" id="mclr">Bỏ hết đánh dấu</button></div></section>`}

function bar(){const n=ST.marks.size;return`<div class="bar"><span>${n?`Đã đánh dấu <b>${n}</b> ô thủ công`:'Sẵn sàng xuất file'}${ST.me?', tự tô đỏ ô trống':''}</span><button class="go" id="go2">Xuất file ngay</button></div>`}

const FUNCS=['IF','AND','OR','NOT','ISEMPTY','ISNUMBER','ISDATE','CONTAINS','STARTSWITH','ENDSWITH','ABS','ROUND','CEIL','FLOOR','MIN','MAX','SUM','AVERAGE','POWER','SQRT','CONCAT','LEFT','RIGHT','MID','LEN','TRIM','LOWER','UPPER','REPLACE','SUBSTITUTE','YEAR','MONTH','DAY'];
async function fapi(u,body){const o={method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'datadesk'},body:JSON.stringify(Object.assign({id:ST.id,table:ST.t,header:ST.hdr},body||{}))};
  const r=await fetch(u,o);if(r.status===401){location='/login';throw new Error('Phiên đăng nhập đã hết hạn.')}
  try{const d=await r.json();if(d&&d.success===undefined&&d.error)return{success:false,errors:[{code:'SERVER',message:d.error}]};return d}catch(e){return{success:false,errors:[{code:'SERVER',message:'Lỗi máy chủ ('+r.status+')'}]}}}

async function fcBtn(id){
  const body={target:ST.fc.target,expression:ST.fc.expr,op_id:ST.fc.op_id};

const NZK=[['text','Chữ và khoảng trắng (họ tên, địa chỉ...)'],['null','Ô trống giả (N/A, -, null...)'],['phone','Số điện thoại'],['email','Email'],['number','Số và tiền (1.234,5; 1.000₫; VND)'],['percentage','Phần trăm'],['date','Ngày']];

function nzRes(){const r=ST.nz.res;if(!r)return'';let h='<div style="margin-top:12px">';

  if(d.overwritten)h+=`<p class="hint" style="color:var(--bad)">⚠ Sẽ ghi đè ${d.overwritten} ô đang có dữ liệu (chỉ trong kết quả, file gốc không đổi).</p>`;

async function mgAnalyze(){
  const b=$('#mg-analyze');if(b){b.disabled=true;b.textContent='Đang phân tích…'}
  const ta=+($('#mg-ta').value||0), tb=+($('#mg-tb').value||1);
  ST.mgTa=ta;ST.mgTb=tb;
  try{
    const res=await fapi('/api/merge/analyze',{table_a:ta,table_b:tb});
    if(res.success){
      ST.mgRes=res.data;
      if(res.data.recommendation)ST.mgMode=res.data.recommendation.mode==='JOIN'?'JOIN':'UNION';
      if(res.data.schema_a&&res.data.schema_a.key_candidates&&res.data.schema_a.key_candidates[0]){
        ST.keyA=res.data.schema_a.key_candidates[0].column_name;
      }
      if(res.data.schema_b&&res.data.schema_b.key_candidates&&res.data.schema_b.key_candidates[0]){
        ST.keyB=res.data.schema_b.key_candidates[0].column_name;
      }
    }else{
      alert((res.errors&&res.errors[0]&&res.errors[0].message)||'Lỗi phân tích');
    }
  }catch(e){alert(e.message)}
  ui();
}

async function mgExecute(){
  const b=$('#mg-exec');if(b){b.disabled=true;b.textContent='Đang gộp bảng…'}
  const ta=+($('#mg-ta').value||0), tb=+($('#mg-tb').value||1);
  const mode=$('#mg-mode')?$('#mg-mode').value:'UNION';
  const ka=$('#mg-key-a')?$('#mg-key-a').value:'';
  const kb=$('#mg-key-b')?$('#mg-key-b').value:'';
  const mappings=ST.mgRes&&ST.mgRes.matching?ST.mgRes.matching.mappings:[];
  try{
    const r=await fapi('/api/merge/execute',{table_a:ta,table_b:tb,mode:mode,key_a:ka,key_b:kb,mappings:mappings});
    if(r.success){
      alert('✓ Gộp bảng thành công: '+r.data.name+(r.data.matched_rows?' (Khớp '+r.data.matched_rows+' dòng)':'. Bảng mới đã được thêm vào phiên.'));
      ST.tables=r.data.tables;
      ST.mgRes=null;
      await loadTable(r.data.new_table_index,true,false);
    }else{
      alert((r.errors&&r.errors[0]&&r.errors[0].message)||'Lỗi khi gộp bảng.');
      if(b){b.disabled=false;b.textContent='⚡ Thực hiện gộp bảng vào phiên làm việc'}
    }
  }catch(e){
    alert(e.message);
    if(b){b.disabled=false;b.textContent='⚡ Thực hiện gộp bảng vào phiên làm việc'}
  }
}

async function mgAddFile(f){
  const fd=new FormData();fd.append('id',ST.id);fd.append('file',f);
  try{
    const r=await fetch('/api/merge/add_file',{method:'POST',headers:{'X-Requested-With':'datadesk'},body:fd}).then(x=>x.json());
    if(r.error)alert(r.error);
    else{
      ST.tables=r.tables;
      ST.mgTa=0;
      ST.mgTb=r.tables.length-1;
      ST.mgRes=null;
      ui();
      alert('✓ Đã nạp thêm file "'+f.name+'" vào phiên làm việc!');
    }
  }catch(e){alert(e.message)}
}

let CFG={ai:false,engine:'Python'};
async function suggest(){
  if(!CFG.ai||!ST)return;
  ST.sug='loading';ui();
  try{const d=await api('/api/suggest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:ST.id,table:ST.t,header:ST.hdr})});ST.sug=d.suggestions}
  catch(e){ST.sug={error:e.message}}
  ui()}
function sug(){
  if(!CFG.ai)return'';const s=ST.sug;let b='';
  if(s==='loading')b='<p class="hint">AI đang phân tích dữ liệu của bạn…</p>';
  else if(s&&s.error)b=`<p class="hint" style="color:var(--bad)">${esc(s.error)}</p>`;
  else if(Array.isArray(s))b=s.length?s.map((x,i)=>`<div class="sg"><div><b>${esc(x.title)}</b><small>${esc(x.reason)}</small></div><button class="add" data-ap="${i}">Áp dụng</button></div>`).join(''):'<p class="hint">AI chưa có gợi ý phù hợp với dữ liệu này.</p>';
  return `<section class="card" id="card-ai"><h2>Gợi ý từ AI</h2><p class="sub">AI chỉ nhận tên cột, kiểu dữ liệu và vài dòng mẫu để đề xuất tùy chọn. Việc xử lý thật do bộ xử lý ${esc(CFG.engine)} thực hiện và được kiểm tra lại.</p>${b}<button class="add" id="ai" style="margin-top:6px"${s==='loading'?' disabled':''}>Gợi ý lại</button></section>`}
function applySug(i){
  const s=ST.sug[i];
  ST.sorts=s.sorts.length?s.sorts.map(x=>({col:x.col,dir:x.dir,type:'auto'})):[{col:-1,dir:'asc',type:'auto'}];
  ST.hls=s.highlights.map(r=>({col:r.col,op:r.op,value:r.value,scope:r.scope,color:r.color}));
  ST.flts=s.filters.map(r=>({col:r.col,op:r.op,value:r.value}));
  ST.res=null;ui();const c=document.querySelectorAll('#work .card')[2];if(c)c.scrollIntoView({behavior:'smooth',block:'start'})}

/* === HIGH-TECH WORKSPACE ENGINE === */
let techNodes=[];
let techPan={x:0,y:0},isPanning=false,panStart={x:0,y:0};
let dragNode=null,dragStartPos={x:0,y:0},dragStartMouse={x:0,y:0};
let globalSearchKeyword='';

function renderTechWorkspace(){
  if(!ST||!ST.info)return;
  const container=$('#tech-space');if(!container)return;
  const I=ST.info,cols=I.columns,N=cols.length;
  
  let h=`
    <div class="tech-grid-bg"></div>
    <div class="tech-toolbar">
      <div class="tech-tool-left">
        <div class="tech-tool-pill" id="drag-cyber-eye" draggable="true" title="Kéo thả vào đầu cột bất kỳ để kích hoạt lọc thu gọn dần dần">
          <span>👁️</span> <b>Cyber Eye</b> <small style="opacity:0.8">(Kéo vào cột)</small>
        </div>
        <button class="tech-btn" id="btn-magnifier" title="Truy tìm từ khóa trên mọi cột và nối dây liên kết">
          <span>🔍</span> Kính Lúp
        </button>
        <button class="tech-btn" id="btn-toggle-all-cols" title="Mở rộng hoặc thu nhỏ tất cả cột">
          <span>⚡</span> Mở tất cả cột
        </button>
        <button class="tech-btn" id="btn-recenter" title="Đưa các node về vị trí trung tâm">
          <span>↺</span> Căn chỉnh lại
        </button>
      </div>
      <div class="tech-tool-right">
        <span class="badge" style="background:rgba(0,240,255,0.15);color:#00f0ff!important;border:1px solid rgba(0,240,255,0.3)">
          ⚡ ${I.n_rows} dòng · ${N} cột · ${ST.tables.length} bảng
        </span>
        <button class="tech-btn active" id="btn-tech-export" style="background:#00f0ff;color:#070e17;font-weight:700">
          📥 Xuất file
        </button>
      </div>
    </div>
    
    <div id="global-search-container">

      <button class="btn-trace" id="btn-deep-trace">⚡ Truy tìm chi tiết (Dossier)</button>
      <button class="tech-btn" id="btn-close-global-search">✕</button>
    </div>
    
    <div id="tech-viewport">
      <div id="tech-canvas-layer">
        <svg id="tech-svg">
          <defs>
            <linearGradient id="cable-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.95"/>
              <stop offset="100%" stop-color="#2457f5" stop-opacity="0.8"/>
            </linearGradient>
          </defs>
          <g id="svg-cables-group"></g>
          <g id="svg-cross-group"></g>
        </svg>
        
        <div id="central-node">
          <div class="central-pulse-ring"></div>
          <div class="central-icon">📁</div>
          <div class="central-title" title="${esc(ST.name)}">${esc(ST.name)}</div>
          <div class="central-stats">
            <b>${I.n_rows}</b> dòng · <b>${I.n_cols}</b> cột<br>
            ${I.empty?`<b>${I.empty}</b> ô trống · `:''}<b>${I.dup}</b> dòng trùng
          </div>
          <div class="central-hint">⚡ Bấm để bung / thu gọn dây</div>
        </div>
        
        <div id="tech-col-nodes-container"></div>
      </div>
    </div>
  `;
  container.innerHTML=h;
  
  const cx=1200,cy=900;
  const centralNode=$('#central-node');
  centralNode.style.left=cx+'px';
  centralNode.style.top=cy+'px';
  
  const vp=$('#tech-viewport');
  techPan={x:-(cx-vp.clientWidth/2),y:-(cy-vp.clientHeight/2)};
  applyCanvasPan();
  
  techNodes=[];
  const nodesContainer=$('#tech-col-nodes-container');
  const cablesGroup=$('#svg-cables-group');
  nodesContainer.innerHTML='';
  cablesGroup.innerHTML='';
  
  const Rx=Math.max(340,Math.min(580,N*42));
  const Ry=Math.max(220,Math.min(380,N*28));
  
  cols.forEach((c,idx)=>{
    const angle=(2*Math.PI*idx/N)-(Math.PI/2);
    const nodeW=200,nodeH=52;
    const nx=cx+Rx*Math.cos(angle)-nodeW/2;
    const ny=cy+Ry*Math.sin(angle)-nodeH/2;
    
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('class','cable-wire');
    path.setAttribute('stroke','url(#cable-grad)');
    path.setAttribute('id',`cable-${idx}`);
    cablesGroup.appendChild(path);
    
    const nodeEl=document.createElement('div');
    nodeEl.className='tech-col-node';
    nodeEl.id=`col-node-${idx}`;
    nodeEl.style.left=nx+'px';
    nodeEl.style.top=ny+'px';
    nodeEl.dataset.colIdx=idx;
    
    nodeEl.innerHTML=`
      <div class="col-node-header" data-drag-col="${idx}">
        <div class="col-header-left">
          <span class="col-drag-handle" title="Nắm kéo">⠿</span>
          <span class="col-title" title="${esc(c.name)}">${esc(c.name)}</span>
          <span class="col-type-tag">${TN[c.type]||c.type}</span>
        </div>
        <button class="col-expand-btn" data-col-toggle="${idx}" title="Mở rộng / Thu nhỏ">⤢</button>
      </div>
      <div class="eye-dock-panel" id="eye-panel-${idx}">
        <span style="font-size:14px">👁️</span>
        <input type="text" placeholder="Lọc STT hoặc giá trị..." class="eye-col-input" data-col-idx="${idx}">
        <button class="eye-dock-close" data-undock="${idx}" title="Tháo Con Mắt">✕</button>
      </div>
      <div class="col-stream-body" id="col-stream-${idx}">
        ${renderStreamRows(idx)}
      </div>
    `;
    
    nodesContainer.appendChild(nodeEl);
    
    techNodes.push({
      idx,
      name:c.name,
      type:c.type,
      x:nx,
      y:ny,
      el:nodeEl,
      pathEl:path,
      expanded:false,
      eyeDocked:false
    });
  });
  
  updateAllCables();
  bindTechEvents();
}

function renderStreamRows(colIdx){
  if(!ST||!ST.grid||!ST.grid.rows||!ST.grid.rows.length){
    const c=ST.info.columns[colIdx];
    return `<div style="padding:12px;text-align:center;color:#94a3b8;font-size:12px">
      Mẫu file: <b style="color:#00f0ff">${esc(c.sample||'Chưa có')}</b><br>
      <small style="color:#64748b">(Đang tải stream dữ liệu...)</small>
    </div>`;
  }
  const colName=ST.info.columns[colIdx].name;
  return ST.grid.rows.map((row,rIdx)=>{
    const val=row[colIdx];
    const isEmpty=val==null||String(val).trim()==='';
    const displayVal=isEmpty?'— TRỐNG —':esc(val);
    const rowNum=(ST.grid.start||0)+rIdx+1;
    return `
      <div class="stream-row" data-row="${rIdx}" data-rownum="${rowNum}" data-val="${esc(val)}">
        <span class="sr-stt">#${rowNum}</span>
        <span class="sr-name" title="${esc(colName)}">${esc(colName)}</span>
        <span class="sr-val ${isEmpty?'empty':''}" title="${displayVal}">${displayVal}</span>
      </div>
    `;
  }).join('');
}

function updateAllColumnStreamData(){
  techNodes.forEach(n=>{
    const streamEl=$(`#col-stream-${n.idx}`);
    if(streamEl)streamEl.innerHTML=renderStreamRows(n.idx);
  });
}

function applyCanvasPan(){
  const cl=$('#tech-canvas-layer');
  if(cl)cl.style.transform=`translate(${techPan.x}px, ${techPan.y}px)`;
}

function updateCable(node){
  const cx=1200,cy=900;
  const nw=node.el.offsetWidth||200,nh=node.el.offsetHeight||52;
  const tx=node.x+nw/2,ty=node.y+nh/2;
  const dx=tx-cx,dy=ty-cy;
  const cp1x=cx+dx*0.45,cp1y=cy;
  const cp2x=cx+dx*0.55,cp2y=ty;
  node.pathEl.setAttribute('d',`M ${cx} ${cy} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${tx} ${ty}`);
}

function updateAllCables(){
  for(let n of techNodes){updateCable(n)}
}

function toggleColumnExpand(colIdx){
  const n=techNodes.find(x=>x.idx===colIdx);
  if(!n)return;
  n.expanded=!n.expanded;
  n.el.classList.toggle('expanded',n.expanded);
  setTimeout(()=>{updateCable(n);if(globalSearchKeyword)drawCrossCables()},300);
}

function toggleAllColumns(){
  const anyClosed=techNodes.some(n=>!n.expanded);
  techNodes.forEach(n=>{
    n.expanded=anyClosed;
    n.el.classList.toggle('expanded',anyClosed);
  });
  const btn=$('#btn-toggle-all-cols');
  if(btn)btn.innerHTML=anyClosed?'<span>⚡</span> Thu gọn tất cả':'<span>⚡</span> Mở tất cả cột';
  setTimeout(()=>{updateAllCables();if(globalSearchKeyword)drawCrossCables()},320);
}

function dockCyberEye(colIdx){
  techNodes.forEach(n=>{
    if(n.eyeDocked&&n.idx!==colIdx)undockCyberEye(n.idx);
  });
  const n=techNodes.find(x=>x.idx===colIdx);
  if(!n)return;
  n.eyeDocked=true;
  if(!n.expanded)toggleColumnExpand(colIdx);
  n.el.classList.add('eye-docked');
  const inp=$(`#eye-panel-${colIdx} input`);
  if(inp){inp.value='';inp.focus()}
  filterColumnStream(colIdx,'');
}

function undockCyberEye(colIdx){
  const n=techNodes.find(x=>x.idx===colIdx);
  if(!n)return;
  n.eyeDocked=false;
  n.el.classList.remove('eye-docked');
  filterColumnStream(colIdx,'');
}

function filterColumnStream(colIdx,query){
  const stream=$(`#col-stream-${colIdx}`);if(!stream)return;
  const q=(query||'').trim().toLowerCase();
  const rows=stream.querySelectorAll('.stream-row');
  rows.forEach(r=>{
    if(!q){
      r.classList.remove('collapsed-row','active-dock-match');
      return;
    }
    const stt=(r.dataset.rownum||'').toLowerCase();
    const val=(r.dataset.val||'').toLowerCase();
    const matches=stt.includes(q)||val.includes(q);
    if(matches){
      r.classList.remove('collapsed-row');
      r.classList.add('active-dock-match');
    }else{
      r.classList.add('collapsed-row');
      r.classList.remove('active-dock-match');
    }
  });
}

function highlightGlobalMatches(q){
  techNodes.forEach(n=>{
    const stream=$(`#col-stream-${n.idx}`);
    if(!stream)return;
    const rows=stream.querySelectorAll('.stream-row');
    rows.forEach(r=>{
      if(!q){
        r.classList.remove('match-highlight');
        return;
      }
      const val=(r.dataset.val||'').toLowerCase();
      if(val&&val.includes(q)){
        r.classList.add('match-highlight');
      }else{
        r.classList.remove('match-highlight');
      }
    });
  });
}

function drawCrossCables(){
  const cg=$('#svg-cross-group');if(!cg)return;
  cg.innerHTML='';
  if(!globalSearchKeyword)return;
  
  const expandedNodes=techNodes.filter(n=>n.expanded);
  if(expandedNodes.length<2)return;
  
  const matchesByRow={};
  expandedNodes.forEach(n=>{
    const stream=$(`#col-stream-${n.idx}`);
    if(!stream)return;
    const highlighted=stream.querySelectorAll('.stream-row.match-highlight');
    highlighted.forEach(r=>{
      const rowIdx=+r.dataset.row;
      if(!matchesByRow[rowIdx])matchesByRow[rowIdx]=[];
      matchesByRow[rowIdx].push({node:n,rowEl:r});
    });
  });
  
  const clRect=$('#tech-canvas-layer').getBoundingClientRect();
  Object.values(matchesByRow).forEach(items=>{
    if(items.length>=2){
      for(let i=0;i<items.length-1;i++){
        const r1=items[i].rowEl.getBoundingClientRect();
        const r2=items[i+1].rowEl.getBoundingClientRect();
        const x1=(r1.left+r1.right)/2-clRect.left;
        const y1=(r1.top+r1.bottom)/2-clRect.top;
        const x2=(r2.left+r2.right)/2-clRect.left;
        const y2=(r2.top+r2.bottom)/2-clRect.top;
        const dx=x2-x1;
        const p=document.createElementNS('http://www.w3.org/2000/svg','path');
        p.setAttribute('class','cross-wire');
        p.setAttribute('d',`M ${x1} ${y1} C ${x1+dx*0.5} ${y1}, ${x2-dx*0.5} ${y2}, ${x2} ${y2}`);
        cg.appendChild(p);
      }
    }
  });
}

function openDossier(rowIdx){
  if(!ST||!ST.grid||!ST.grid.rows||!ST.grid.rows[rowIdx])return;
  const rowData=ST.grid.rows[rowIdx];
  const rowNum=(ST.grid.start||0)+rowIdx+1;
  const modal=$('#dossier-modal');
  $('#dossier-title').textContent=`Hồ sơ đối tượng dòng #${rowNum}`;
  
  let h=`<div class="dossier-grid">`;
  ST.info.columns.forEach((c,cIdx)=>{
    const val=rowData[cIdx];
    const isBlank=val==null||String(val).trim()==='';
    h+=`
      <div class="dossier-item">
        <b>${esc(c.name)} (${TN[c.type]||c.type})</b>
        <span style="${isBlank?'color:#f87171;font-style:italic':''}">${isBlank?'— TRỐNG —':esc(val)}</span>
      </div>
    `;
  });
  h+=`</div>`;
  $('#dossier-body').innerHTML=h;
  
  $('#dossier-mark-btn').onclick=()=>{
    ST.info.columns.forEach((_,cIdx)=>{
      ST.marks.add(`${rowIdx}:${cIdx}`);
    });
    alert(`Đã đánh dấu (tô đỏ) toàn bộ các ô thuộc dòng #${rowNum}`);
    modal.style.display='none';
    ui();
  };
  $('#dossier-filter-btn').onclick=()=>{
    ST.flts.push({col:0,op:'contains',value:String(rowData[0]||'')});
    alert(`Đã thêm quy tắc lọc giữ dòng #${rowNum}`);
    modal.style.display='none';
    ui();
  };
  $('#dossier-copy-btn').onclick=()=>{
    const obj={};
    ST.info.columns.forEach((c,cIdx)=>{obj[c.name]=rowData[cIdx]});
    navigator.clipboard.writeText(JSON.stringify(obj,null,2));
    alert('Đã sao chép hồ sơ dòng dưới dạng JSON vào bộ nhớ đệm!');
  };
  
  modal.style.display='flex';
}
$('#dossier-close').onclick=()=>{$('#dossier-modal').style.display='none'};

function bindTechEvents(){
  const vp=$('#tech-viewport');
  if(!vp)return;
  
  vp.onmousedown=e=>{
    const header=e.target.closest('.col-node-header');
    if(header){
      const colIdx=+header.dataset.dragCol;
      dragNode=techNodes.find(n=>n.idx===colIdx);
      if(dragNode){
        dragStartPos={x:dragNode.x,y:dragNode.y};
        dragStartMouse={x:e.clientX,y:e.clientY};
        return;
      }
    }
    if(!e.target.closest('.tech-col-node')&&!e.target.closest('#central-node')){
      isPanning=true;
      panStart={x:e.clientX-techPan.x,y:e.clientY-techPan.y};
      vp.classList.add('panning');
    }
  };
  
  window.addEventListener('mousemove',e=>{
    if(dragNode){
      const dx=e.clientX-dragStartMouse.x;
      const dy=e.clientY-dragStartMouse.y;
      dragNode.x=dragStartPos.x+dx;
      dragNode.y=dragStartPos.y+dy;
      dragNode.el.style.left=dragNode.x+'px';
      dragNode.el.style.top=dragNode.y+'px';
      updateCable(dragNode);
      if(globalSearchKeyword)drawCrossCables();
    }else if(isPanning){
      techPan.x=e.clientX-panStart.x;
      techPan.y=e.clientY-panStart.y;
      applyCanvasPan();
    }
  });
  
  window.addEventListener('mouseup',()=>{
    dragNode=null;
    if(isPanning){
      isPanning=false;
      vp.classList.remove('panning');
    }
  });
  
  $('#central-node').onclick=()=>toggleAllColumns();
  $('#btn-toggle-all-cols').onclick=()=>toggleAllColumns();
  $('#btn-recenter').onclick=()=>{
    const cx=1200,cy=900;
    techPan={x:-(cx-vp.clientWidth/2),y:-(cy-vp.clientHeight/2)};
    applyCanvasPan();
  };
  
  $('#btn-magnifier').onclick=()=>{
    const sc=$('#global-search-container');
    const isShowing=sc.style.display==='flex';
    sc.style.display=isShowing?'none':'flex';
    if(!isShowing)$('#global-search-input').focus();
    else{
      globalSearchKeyword='';
      highlightGlobalMatches('');
      drawCrossCables();
    }
  };
  $('#btn-close-global-search').onclick=()=>{
    $('#global-search-container').style.display='none';
    globalSearchKeyword='';
    highlightGlobalMatches('');
    drawCrossCables();
  };
  
  $('#global-search-input').oninput=e=>{
    const q=e.target.value.trim().toLowerCase();
    globalSearchKeyword=q;
    highlightGlobalMatches(q);
    drawCrossCables();
  };
  
  $('#btn-deep-trace').onclick=()=>{
    if(!globalSearchKeyword){
      alert('Vui lòng nhập từ khóa tìm kiếm để truy tìm chi tiết!');
      return;
    }
    let foundRow=-1;
    if(ST&&ST.grid&&ST.grid.rows){
      for(let r=0;r<ST.grid.rows.length;r++){
        for(let c=0;c<ST.grid.rows[r].length;c++){
          const val=String(ST.grid.rows[r][c]||'').toLowerCase();
          if(val.includes(globalSearchKeyword)){
            foundRow=r;
            break;
          }
        }
        if(foundRow>=0)break;
      }
    }
    if(foundRow>=0)openDossier(foundRow);
    else alert(`Không tìm thấy dòng nào chứa từ khóa "${globalSearchKeyword}"`);
  };
  
  $('#btn-tech-export').onclick=()=>run(false);
  
  // Drag and drop Cyber Eye
  const eyePill=$('#drag-cyber-eye');
  eyePill.ondragstart=e=>{
    e.dataTransfer.setData('text/plain','cyber-eye');
  };
  eyePill.onclick=()=>{
    const target=techNodes.find(n=>!n.eyeDocked)||techNodes[0];
    if(target)dockCyberEye(target.idx);
  };
  
  techNodes.forEach(n=>{
    n.el.ondragover=e=>{e.preventDefault();n.el.style.borderColor='#a855f7'};
    n.el.ondragleave=()=>{if(!n.eyeDocked)n.el.style.borderColor='rgba(0,240,255,0.35)'};
    n.el.ondrop=e=>{
      e.preventDefault();
      dockCyberEye(n.idx);
    };
  });
  
  $('#tech-space').onclick=e=>{
    const toggleBtn=e.target.closest('[data-col-toggle]');
    if(toggleBtn){
      toggleColumnExpand(+toggleBtn.dataset.colToggle);
      return;
    }
    const undockBtn=e.target.closest('[data-undock]');
    if(undockBtn){
      undockCyberEye(+undockBtn.dataset.undock);
      return;
    }
    const rowEl=e.target.closest('.stream-row');
    if(rowEl&&e.detail===2){
      openDossier(+rowEl.dataset.row);
    }
  };
  
  $('#tech-space').oninput=e=>{
    if(e.target.classList.contains('eye-col-input')){
      const colIdx=+e.target.dataset.colIdx;
      filterColumnStream(colIdx,e.target.value);
    }
  };
}
