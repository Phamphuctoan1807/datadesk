<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>Đăng nhập · DataDesk J.A.R.V.I.S. Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at center,#0d1f38 0%,#030712 100%);color:#dbeafe;font:400 15px/1.5 "Be Vietnam Pro",system-ui,sans-serif;padding:16px;overflow:hidden;position:relative}
#bg-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.scanline{position:fixed;inset:0;background:linear-gradient(rgba(0,240,255,0.02) 50%,rgba(0,0,0,0.18) 50%);background-size:100% 4px;pointer-events:none;z-index:1}

/* HUD Tech Card with Chamfered Borders */
.c{
  background:rgba(10,22,38,0.85);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(0,240,255,0.4);
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px);
  padding:36px 30px;
  width:100%;
  max-width:410px;
  box-shadow:0 25px 60px -10px rgba(0,0,0,0.85),0 0 35px rgba(0,240,255,0.2),inset 0 0 20px rgba(0,240,255,0.06);
  position:relative;
  z-index:2;
  animation:fadeIn 0.35s cubic-bezier(0.16,1,0.3,1);
}
.c::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,240,255,0.1) 0%,transparent 40%,rgba(168,85,247,0.08) 100%);
  pointer-events:none;
}
.hud-corner{position:absolute;width:10px;height:10px;border-color:#00f0ff;pointer-events:none}
.hud-corner.tl{top:6px;left:6px;border-top:2px solid #00f0ff;border-left:2px solid #00f0ff}
.hud-corner.tr{top:6px;right:6px;border-top:2px solid #00f0ff;border-right:2px solid #00f0ff}
.hud-corner.bl{bottom:6px;left:6px;border-bottom:2px solid #00f0ff;border-left:2px solid #00f0ff}
.hud-corner.br{bottom:6px;right:6px;border-bottom:2px solid #00f0ff;border-right:2px solid #00f0ff}

.logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#00f0ff,#2457f5);color:#070e17;display:grid;place-items:center;font-weight:800;font-size:22px;margin-bottom:16px;box-shadow:0 0 20px rgba(0,240,255,0.5);text-shadow:0 0 4px rgba(255,255,255,0.8)}
.hud-tag{font-family:"JetBrains Mono",monospace;font-size:11px;color:#00f0ff;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.hud-tag::before{content:'';width:6px;height:6px;border-radius:50%;background:#00f0ff;box-shadow:0 0 8px #00f0ff;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

h1{font-size:24px;margin:0 0 6px;font-weight:700;color:#fff;letter-spacing:-0.4px;text-shadow:0 0 12px rgba(0,240,255,0.3)}
p{margin:0 0 22px;color:#94a3b8;font-size:13.5px}
.w{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;border:1px solid rgba(0,240,255,0.35);background:rgba(6,14,26,0.85);color:#fff;border-radius:8px;padding:12px 14px;transition:all 0.2s}
input:focus{outline:none;border-color:#00f0ff;box-shadow:0 0 14px rgba(0,240,255,0.4);background:rgba(10,22,38,0.95)}
.s{border:1px solid rgba(0,240,255,0.35);background:rgba(15,30,52,0.8);border-radius:8px;padding:0 14px;cursor:pointer;font:inherit;font-weight:600;color:#38bdf8;transition:all 0.2s}
.s:hover{background:rgba(0,240,255,0.15);border-color:#00f0ff;color:#fff}
.go{width:100%;margin-top:16px;background:linear-gradient(135deg,#00f0ff,#2457f5);color:#070e17;border:0;border-radius:8px;padding:12px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 0 20px rgba(0,240,255,0.4);transition:all 0.2s;letter-spacing:0.3px}
.go:hover{transform:translateY(-1px);box-shadow:0 0 26px rgba(0,240,255,0.6);color:#000}
.go:active{transform:translateY(0)}
.go:disabled{opacity:.6;cursor:not-allowed;transform:none}
.v{color:#64748b;font-size:11.5px;margin:18px 0 0;text-align:center;font-family:"JetBrains Mono",monospace}
#m{color:#f87171;min-height:1.3em;margin:10px 0 0;font-size:13px;font-weight:500;text-shadow:0 0 8px rgba(248,113,113,0.3)}
:focus-visible{outline:2px solid #00f0ff;outline-offset:2px}
[hidden]{display:none!important}

/* Intro Overlay Modal */
.ov{position:fixed;inset:0;background:rgba(3,7,18,0.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;padding:16px;z-index:10;animation:fadeIn 0.25s ease-out}
.md{
  background:rgba(10,22,38,0.92);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(0,240,255,0.45);
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px);
  padding:36px 32px;
  width:100%;
  max-width:410px;
  text-align:center;
  box-shadow:0 25px 60px -10px rgba(0,0,0,0.85),0 0 35px rgba(0,240,255,0.25);
  position:relative;
}
.md .logo{margin:0 auto 16px}
.md h2{font-size:22px;margin:0 0 8px;font-weight:700;color:#fff}
.md p{margin:0 0 24px;font-size:15px;color:#94a3b8}

/* Bottom Micro-Telemetry Ticker */
.telemetry-ticker{position:fixed;bottom:10px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;font-family:"JetBrains Mono",monospace;font-size:11px;color:#64748b;z-index:3;pointer-events:none}
.telemetry-ticker b{color:#00f0ff;font-weight:600}

@keyframes fadeIn{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
</style></head><body>
<canvas id="bg-canvas"></canvas>
<div class="scanline"></div>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ot">
  <div class="md">
    <div class="hud-corner tl"></div><div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div><div class="hud-corner br"></div>
    <div class="logo">D</div>
    <div class="hud-tag">⚡ J.A.R.V.I.S. SPATIAL ACCESS</div>
    <h2 id="ot">Chào mừng bạn</h2>
    <p>Đây là dự án của <b>Toàn Phạm</b>.<br><small style="color:#64748b">C++ Engine Core · Python Independent Validator</small></p>
    <button class="go" id="ok" type="button">ĐÃ HIỂU, TIẾP TỤC</button>
  </div>
</div>

<form class="c" id="f" hidden>
  <div class="hud-corner tl"></div><div class="hud-corner tr"></div>
  <div class="hud-corner bl"></div><div class="hud-corner br"></div>
  <div class="logo">D</div>
  <div class="hud-tag">⚡ J.A.R.V.I.S. HOLOGRAM CORE</div>
  <h1>DataDesk</h1>
  <p>Cổng truy cập an toàn. Nhập mật khẩu để khởi tạo.</p>
  <div class="w">
    <input id="p" type="password" autocomplete="current-password" placeholder="Mật khẩu (mặc định: admin)" required>
    <button type="button" class="s" id="t">Hiện</button>
  </div>
  <button class="go" id="b">ĐĂNG NHẬP HỆ THỐNG</button>
  <p id="m" role="alert"></p>
  <p class="v" id="ver"></p>
</form>

<div class="telemetry-ticker">
  <div>⚡ HUD COORDINATES: <span id="tele-mouse">X: 0, Y: 0</span></div>
  <div>C++ ENGINE: <b>ACTIVE</b> | PYTHON VALIDATOR: <b>READY</b></div>
</div>

<script>
// --- Canvas Hạt Dữ Liệu Hỗn Loạn & Đẩy Chuột (Physics) ---
(function(){
  const cvs = document.getElementById('bg-canvas');
  if(!cvs) return;
  const ctx = cvs.getContext('2d');
  let W = cvs.width = window.innerWidth;
  let H = cvs.height = window.innerHeight;
  window.addEventListener('resize', ()=>{ W = cvs.width = window.innerWidth; H = cvs.height = window.innerHeight; });

  const TOKENS = [
    '0101', '42.5%', 'NULL', 'ID:904', '∑', '.xlsx', 'JSON', 'C++', '2026', 'VARCHAR',
    'TRUE', '1.234,5', 'VND', 'λ', 'UTF-8', 'TABLE', 'SCHEMA', 'KEY:01', 'APPEND', 'JOIN',
    'CSV', 'REGEX', 'DATA', 'HASH', 'BYTE', '0xFF', 'TOKEN', 'PARSER', 'NODE', 'INDEX',
    'Δ', 'π', '∞', 'SAFE', 'VERIFIED'
  ];
  const COLORS = ['#00f0ff', '#2457f5', '#a855f7', '#00ff9d', '#f59e0b', '#38bdf8', '#818cf8'];

  const count = Math.min(75, Math.floor((W * H) / 14000));
  const particles = [];

  for(let i=0; i<count; i++){
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.7,
      vy: (Math.random() - 0.5) * 0.7,
      baseVx: (Math.random() - 0.5) * 0.6,
      baseVy: (Math.random() - 0.5) * 0.6,
      text: TOKENS[Math.floor(Math.random() * TOKENS.length)],
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      size: Math.floor(Math.random() * 5) + 11,
      alpha: Math.random() * 0.5 + 0.35,
      rot: (Math.random() - 0.5) * 0.2
    });
  }

  const mouse = { x: -9999, y: -9999, radius: 140 };
  const teleMouse = document.getElementById('tele-mouse');
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    if(teleMouse) teleMouse.textContent = `X: ${e.clientX}, Y: ${e.clientY}`;
  });
  window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

  function render(){
    ctx.clearRect(0, 0, W, H);

    for(let i=0; i<particles.length; i++){
      const p = particles[i];

      const dx = p.x - mouse.x;
      const dy = p.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if(dist < mouse.radius && dist > 0){
        const force = (mouse.radius - dist) / mouse.radius;
        const pushX = (dx / dist) * force * 5.5;
        const pushY = (dy / dist) * force * 5.5;
        p.vx += pushX;
        p.vy += pushY;
      }

      p.vx = p.vx * 0.94 + p.baseVx * 0.06;
      p.vy = p.vy * 0.94 + p.baseVy * 0.06;

      p.x += p.vx;
      p.y += p.vy;

      if(p.x < -60) p.x = W + 50;
      else if(p.x > W + 60) p.x = -50;
      if(p.y < -30) p.y = H + 30;
      else if(p.y > H + 30) p.y = -30;

      ctx.save();
      ctx.font = `${p.size}px "JetBrains Mono", monospace`;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha;
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    }

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();

// --- Logic xác thực & đăng nhập ---
const f=document.getElementById('f'),p=document.getElementById('p'),m=document.getElementById('m'),b=document.getElementById('b');
fetch('/version').then(r=>r.json()).then(d=>{document.getElementById('ver').textContent='Phiên bản '+d.version+' (J.A.R.V.I.S. Core)'}).catch(()=>{});
const ov=document.getElementById('ov'),ok=document.getElementById('ok');
function closeIntro(){ov.remove();f.hidden=false;p.focus()}
ok.onclick=closeIntro;ok.focus();document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('ov'))closeIntro()});
document.getElementById('t').onclick=e=>{p.type=p.type==='password'?'text':'password';e.target.textContent=p.type==='password'?'Hiện':'Ẩn'};
f.onsubmit=async e=>{e.preventDefault();b.disabled=true;m.textContent='';
try{const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})});const d=await r.json();
if(r.ok)location='/';else m.textContent=d.error||'Không đăng nhập được.'}catch(x){m.textContent='Không kết nối được máy chủ.'}b.disabled=false};
</script></body></html>
